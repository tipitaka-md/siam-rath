name: Sync Upstream Siam Rath Tipitaka

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Run deterministic conversion
        run: |
          uv run --python 3.11 convert.py --sync

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vinaya sutta abhidhamma
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: sync converted Markdown with upstream D-tipitaka updates"
            git push
          fi
